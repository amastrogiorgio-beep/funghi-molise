name: Mappa funghi settimanale

on:
  schedule:
    - cron: "0 5 * * 4"   # giovedi' 06:00 ora italiana (07:00 d'estate)
    - cron: "0 5 * * 5"   # venerdi': secondo tentativo se giovedi' e' fallito
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: mappa
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      built: ${{ steps.run.outputs.built }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install shapely numpy requests tifffile
      - id: run
        run: |
          SKIP=""
          if [ "${{ github.event_name }}" = "schedule" ]; then SKIP="--skip-if-recent 3"; fi
          python build.py --out site $SKIP
          if [ -f site/mappa-funghi-molise.html ]; then
            cp site/mappa-funghi-molise.html site/index.html
            echo "built=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Salva cache e storico
        if: steps.run.outputs.built == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cache history
          git diff --cached --quiet || git commit -m "Aggiornamento mappa $(date -u +%F)"
          git push
      - uses: actions/upload-pages-artifact@v3
        if: steps.run.outputs.built == 'true'
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.built == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
